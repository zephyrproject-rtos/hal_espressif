# Notes:
# - ESP32-C61 has 30 GPIO pads (GPIO0-GPIO29)
# - GPIO15-GPIO21 are the MSPI flash pads (CS0, MISO, WP, VDD_SPI, HD,
#   CLK, MOSI) and are excluded from the peripheral mux ranges

uart0:
  tx:
    sigo: u0txd_out
    gpio: [[0, 14], [22, 29]]
  rx:
    sigi: u0rxd_in
    gpio: [[0, 14], [22, 29]]
  rts:
    sigo: u0rts_out
    gpio: [[0, 14], [22, 29]]
